aid: universitat-hamburg
name: Universität Hamburg
x-type: university
x-category: Public Research University
description: >-
  Universität Hamburg is a public research university in Hamburg, Germany, and one
  of the largest in the country. It operates no central developer portal, publishes
  no OpenAPI of its own, and has no course, registrar, campus-life or open-data API
  — the STiNE campus-management system and the Katalogplus discovery service are
  both behind an authorization wall. What it does operate, on its own hosts and
  with its own engineering, is scholarly-communication and identity infrastructure:
  a research-data repository (ZFDM, www.fdr.uni-hamburg.de) whose read API returns
  unauthenticated JSON with CORS and rate-limit headers; five live OAI-PMH 2.0
  repositories across dissertations, research data, the university press, its
  journal server and its digitized collections; and its own Shibboleth SAML 2.0
  Identity Provider, whose metadata is published at login.uni-hamburg.de and
  registered in the DFN-AAI federation and thereby in eduGAIN. It is a DataCite
  registrant (prefix 10.25592) and its library is a Crossref member (prefix
  10.15460). Almost all of this is library-and-computing-centre infrastructure
  rather than a product; none of it is documented for third-party developers.
