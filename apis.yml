    name: ZFDM Research Data Repository API
    x-operator: institution
    description: >-
      Read API of the ZFDM Repository (Forschungsdatenrepositorium), operated by
      Universität Hamburg's Zentrum für nachhaltiges Forschungsdatenmanagement on
      the institution's own host. Returns records, communities, licenses and file
      buckets as unauthenticated JSON with Access-Control-Allow-Origin *, RFC 8288
      Link pagination and X-RateLimit-* headers (limit 5000). Deposit paths return
      401. Records carry DataCite DOIs under the institutional prefix 10.25592 and
      ORCID iDs on creators. The repository runs Invenio, so the contract SHAPE
      originates upstream; the deployment, host, identifiers and data are the
      institution's, and the OpenAPI below was derived by API Evangelist from live
      probes because the institution publishes none.
