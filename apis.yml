x-coverage:
  state: covered
  reason: covered
  detail: >-
    Re-profiled 2026-09-01 under the university pipeline. Eleven surfaces settled
    on the operator axis: eight institution-operated, one federation, three
    registry (DataCite counted once across two registrant clients). The
    substantive find is that Universität Hamburg does operate real
    institution-engineered machine-readable surfaces — a live unauthenticated
    JSON research-data API, five OAI-PMH 2.0 repositories, and its own Shibboleth
    SAML 2.0 IdP registered in DFN-AAI/eduGAIN — none of which were catalogued in
    the June 2026 profile, which held only two entries. No vendor contract was
    saved and none was found in the repo to remove: the audit's verdict counts
    were {"institution": 2} with no tenant, hostless, shared-contract or misbased
    findings. What is genuinely absent is a developer-facing footprint: no
    developer portal, no institution-published OpenAPI, no /llms.txt, no
    /.well-known/security.txt, no OAuth server, no course or open-data API. Two
    plausible surfaces were probed and REJECTED as dead rather than counted:
    katalogplus.sub.uni-hamburg.de returns an identical 1,989-byte "SUBHHCore
    Authorization" page on every path including /api/v1/, and
    kataloge.uni-hamburg.de returns its cookie-consent shell for /api/v1/search
    and /OAI/Server alike. One surface was rejected as another institution's: the
    OGC API - Features service at api.hamburg.de belongs to the Freie und
    Hansestadt Hamburg's Urban Data Platform, not to the university, and is not
    recorded here.
  evidence:
    - url: https://www.fdr.uni-hamburg.de/api/records/?size=1&sort=mostrecent
      status: 200
    - url: https://www.fdr.uni-hamburg.de/api/records/999999999
