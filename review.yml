  - date: '2026-09-01'
    rating: 3
    summary: >-
      Re-profiled under the API Evangelist university pipeline, operator axis
      first. The June 2026 profile held two surfaces and no artifacts; it was not
      wrong, it was incomplete. Universität Hamburg does operate real
      institution-engineered machine-readable infrastructure, all of it on its own
      hosts: an unauthenticated JSON research-data API at www.fdr.uni-hamburg.de
      (CORS open, X-RateLimit-Limit 5000, RFC 8288 Link pagination, 401 on
      deposit, 404 with a JSON error body), FIVE live OAI-PMH 2.0 repositories,
      and its own Shibboleth SAML 2.0 Identity Provider whose metadata it publishes
      at login.uni-hamburg.de and which is registered in DFN-AAI and thereby
      eduGAIN. Registry memberships evidenced: DataCite (prefix 10.25592, client
      tib.fdmuh; library client zbw.subhh), Crossref (member 25426, prefix
      10.15460, 3,954 DOIs), ROR (00g30e956). No vendor contract was found in the
      repo and none was added; the institution publishes no OpenAPI, so the single
      spec in this repo was derived by API Evangelist from live probes and is
      marked as such. Genuinely absent: developer portal, /llms.txt,
      /.well-known/security.txt, OAuth, course/registrar API, open-data portal.
      Two candidate surfaces were probed and rejected as soft-200 shells rather
      than counted, and one (api.hamburg.de OGC API - Features) was rejected as
      the CITY of Hamburg's, not the university's.
